# Gradle Daemon — tuned for 8 GB RAM
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError

# Kotlin daemon fallback — only used if in-process is off
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Run Kotlin inside Gradle — saves RAM
kotlin.compiler.execution.strategy=in-process

# Memory-friendly parallel build settings
org.gradle.workers.max=1
org.gradle.parallel=true

# Android modernization
android.useAndroidX=true
android.enableJetifier=true

# AGP 9+ features
android.newDsl=true
android.builtInKotlin=true
