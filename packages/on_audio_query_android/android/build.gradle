group = 'com.lucasjosino.on_audio_query'
version = '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
// Kotlin Gradle Plugin is applied automatically by AGP Built-in Kotlin
// (android.builtInKotlin=true in the app's gradle.properties).
// Do NOT apply 'kotlin-android' here or it will double-apply and warn/fail.

android {
    namespace = 'com.lucasjosino.on_audio_query'
    compileSdk = 37

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk = 27
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    def lifecycle_version = "2.3.1"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
}
